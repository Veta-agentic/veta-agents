[project]
name = "veta-agents"
version = "0.0.1"
requires-python = "==3.12.10"
readme = "README.md"

dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "azure-monitor-opentelemetry",
    "opentelemetry-api",
    "httpx",
    "beautifulsoup4",
    "semantic-kernel>=1.41.0",
    "python-dotenv",
    "azure-keyvault-secrets",
    "pillow",
    "azure-identity>=1.25.0",
    "azure-monitor-query>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-watch>=4.2.0,<5",
    "expects>=0.9.0,<0.10",
    "doublex>=1.9.6.1,<2",
    "coverage>=7.6.1,<8",
    "ruff>=0.6.7,<0.7",
    "ty>=0.0.1a6",
    "pytest-asyncio>=1.0.0",
]

[tool.uv]
default-groups = ["dev"]
prerelease = "allow"
override-dependencies = ["av>=13.1.0,<14"]
