[project]
name = "veta-agents"
version = "0.0.1"
requires-python = "==3.12.10"
readme = "README.md"

dependencies = [
    "fastapi[standard]>=0.135.3",
    "uvicorn>=0.44.0",
    "azure-monitor-opentelemetry>=1.8.7",
    "opentelemetry-api>=1.40.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.14.3",
    "semantic-kernel>=1.41.1",
    "python-dotenv>=1.2.2",
    "azure-keyvault-secrets>=4.10.0",
    "pillow>=12.2.0",
    "azure-identity>=1.25.3,<1.26.0a0",
    "azure-monitor-query>=2.0.0",
    "azure-ai-agents>=1.2.0b3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10",
    "pytest-watch>=4.2.0,<5",
    "expects>=0.9.0,<0.10",
    "doublex>=1.9.6.1,<2",
    "coverage>=7.13.0,<8",
    "ruff>=0.15.0",
    "ty>=0.0.29",
    "pytest-asyncio>=1.3.0,<1.4.0a0",
]

[tool.uv]
default-groups = ["dev"]
constraint-dependencies = ["av!=14.4.0"]
